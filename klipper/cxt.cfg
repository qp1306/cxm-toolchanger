#####################################################################
# CXT - CxChanger toolchanger engine for Klipper
# https://github.com/qp1306/cxm-toolchanger
#
# Every number lives in [save_variables] (keys start with "cxt_").
# Change them with CXT_SET / CXT_DOCK_SAVE / CXT_NUDGE (or the web page):
# they take effect on the next tool change. No Klipper restart.
# Only editing THIS file needs a restart.
#
# Tool state: -2 UNKNOWN, -1 EMPTY carriage, 0..11 hotend mounted.
#####################################################################

[gcode_macro _CXT_ENGINE]
description: Engine version (the web page compares this with the repo)
variable_version: "0.1.0"
gcode:
    RESPOND MSG="CXT engine {printer['gcode_macro _CXT_ENGINE'].version}"

#--------------------------------------------------------------------
# Defaults. Used ONLY when the cxt_<name> key is not in save_variables.
#--------------------------------------------------------------------
[gcode_macro _CXT_DEFAULTS]
variable_tool_count: 3
variable_shift_x: -4.8          # swing-arm X travel at the dock
variable_dodge_y: 14.0          # Y dodge distance from the dock datum
variable_clearance_y: 44.0      # corridor = furthest dock Y + this
variable_margin_y: 15.0         # fast travel stops this far before the dodge point
variable_feed_travel: 600       # mm/min  (10 mm/s)
variable_feed_approach: 240     # mm/min  (4 mm/s)
variable_feed_latch: 180        # mm/min  (3 mm/s)
variable_feed_z: 600            # mm/min
variable_min_z: 20.0            # Z lifted to at least this before a change (not printing)
variable_samples: 3             # sensor readings per check
variable_sample_ms: 60          # real time between readings
variable_print_enabled: 0       # 1 = allow tool changes during prints (stage 4)
variable_sensor: "gcode_button cxm_tool_detect"
gcode:

[gcode_macro _CXT_STATE]
variable_tool: -2
variable_fault: 1
gcode:

#--------------------------------------------------------------------
# Startup: only trust EMPTY, and only when two signals agree.
#--------------------------------------------------------------------
[delayed_gcode _CXT_BOOT]
initial_duration: 2.0
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set s = printer[V.get("cxt_sensor", D.sensor)] %}
    {% set present = (s.state == "PRESSED") if "state" in s else s.filament_detected %}
    {% if V.get("cxt_current_tool", -2)|int == -1 and not present %}
        SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=tool VALUE=-1
        SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=fault VALUE=0
        RESPOND MSG="CXT: carriage EMPTY (saved state and sensor agree)"
    {% else %}
        RESPOND TYPE=error MSG="CXT: carriage state UNKNOWN - check it, then CXT_DECLARE TOOL=<n or -1>"
    {% endif %}

#--------------------------------------------------------------------
# Sensor: one reading per macro call (renders at execution time).
#--------------------------------------------------------------------
[gcode_macro _CXT_SENSE]
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set s = printer[V.get("cxt_sensor", D.sensor)] %}
    {% set present = (s.state == "PRESSED") if "state" in s else s.filament_detected %}
    {% set want = params.EXPECT %}
    {% if (want == "present") != present %}
        { action_raise_error("CXT: carriage sensor says %s, expected %s (%s)" % ("PRESENT" if present else "EMPTY", want|upper, params.WHY|default("check"))) }
    {% endif %}

[gcode_macro _CXT_CONFIRM]
description: Several sensor readings with real time between them
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set n = V.get("cxt_samples", D.samples)|int %}
    {% set ms = V.get("cxt_sample_ms", D.sample_ms)|int %}
    M400
    _CXT_SENSE EXPECT={params.EXPECT} WHY={params.WHY|default("check")}
    {% for i in range(n - 1) %}
        G4 P{ms}
        M400
        _CXT_SENSE EXPECT={params.EXPECT} WHY={params.WHY|default("check")}
    {% endfor %}

[gcode_macro _CXT_COMMIT]
gcode:
    {% set t = params.TOOL|int %}
    SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=tool VALUE={t}
    SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=fault VALUE=0
    SAVE_VARIABLE VARIABLE=cxt_current_tool VALUE={t}

[gcode_macro _CXT_APPLY_OFFSETS]
gcode:
    {% set V = printer.save_variables.variables %}
    {% set t = printer["gcode_macro _CXT_STATE"].tool|int %}
    {% if t >= 0 %}
        SET_GCODE_OFFSET X={V.get("cxt_t%d_ox" % t, 0.0)} Y={V.get("cxt_t%d_oy" % t, 0.0)} Z={V.get("cxt_t%d_oz" % t, 0.0)} MOVE=0
    {% else %}
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    {% endif %}

#--------------------------------------------------------------------
# Tool change
#--------------------------------------------------------------------
[gcode_macro CXT_SELECT]
description: Change hotend. CXT_SELECT TOOL=n picks up, TOOL=-1 docks the mounted one.
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set S = printer["gcode_macro _CXT_STATE"] %}
    {% set target = params.TOOL|default(-99)|int %}
    {% set cur = S.tool|int %}
    {% set count = V.get("cxt_tool_count", D.tool_count)|int %}
    {% set homed = printer.toolhead.homed_axes %}
    {% set printing = "print_stats" in printer and printer.print_stats.state in ("printing", "paused") %}
    {% if S.fault|int != 0 or cur == -2 %}
        { action_raise_error("CXT: carriage state UNKNOWN. Check it, then CXT_DECLARE TOOL=<n or -1>. Nothing moved.") }
    {% elif target < -1 or target >= count %}
        { action_raise_error("CXT: T%d is not one of the %d configured tools" % (target, count)) }
    {% elif "x" not in homed or "y" not in homed or "z" not in homed %}
        { action_raise_error("CXT: home X, Y and Z first") }
    {% elif printing and V.get("cxt_print_enabled", D.print_enabled)|int != 1 %}
        { action_raise_error("CXT: tool changes during prints are not enabled yet (cxt_print_enabled)") }
    {% elif target == cur %}
        RESPOND MSG="CXT: T{cur} already selected"
    {% else %}
        {% for t in [cur, target] if t >= 0 %}
            {% if ("cxt_t%d_x" % t) not in V or ("cxt_t%d_y" % t) not in V %}
                { action_raise_error("CXT: T%d has no saved dock position - CXT_DOCK_SAVE TOOL=%d first. Nothing moved." % (t, t)) }
            {% endif %}
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=fault VALUE=1
        SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=tool VALUE=-2
        _CXT_CONFIRM EXPECT={"present" if cur >= 0 else "empty"} WHY=before_moving
        SAVE_GCODE_STATE NAME=cxt_select
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
        G90
        _CXT_PREFLIGHT TOOLS={cur},{target}
        {% if cur >= 0 %}
            _CXT_DOCK_MOVE TOOL={cur} MODE=release
            _CXT_CONFIRM EXPECT=empty WHY=after_release_T{cur}
            _CXT_COMMIT TOOL=-1
        {% endif %}
        {% if target >= 0 %}
            SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=fault VALUE=1
            SET_GCODE_VARIABLE MACRO=_CXT_STATE VARIABLE=tool VALUE=-2
            _CXT_DOCK_MOVE TOOL={target} MODE=pickup
            _CXT_CONFIRM EXPECT=present WHY=after_pickup_T{target}
            _CXT_COMMIT TOOL={target}
        {% endif %}
        RESTORE_GCODE_STATE NAME=cxt_select MOVE=0
        _CXT_APPLY_OFFSETS
        RESPOND MSG="CXT: T{target} selected"
    {% endif %}

# Checks everything about BOTH tools before the first move. Rendered after
# offsets were cleared, so it sees the real machine frame.
[gcode_macro _CXT_PREFLIGHT]
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set gm = printer.gcode_move %}
    {% set pos = printer.toolhead.position %}
    {% set amin = printer.toolhead.axis_minimum %}
    {% set amax = printer.toolhead.axis_maximum %}
    {% set count = V.get("cxt_tool_count", D.tool_count)|int %}
    {% set shift = V.get("cxt_shift_x", D.shift_x)|float %}
    {% set dodge = V.get("cxt_dodge_y", D.dodge_y)|float %}
    {% set clear = V.get("cxt_clearance_y", D.clearance_y)|float %}
    {% set min_z = V.get("cxt_min_z", D.min_z)|float %}
    {% set printing = "print_stats" in printer and printer.print_stats.state in ("printing", "paused") %}
    {% set ys = [] %}
    {% for t in range(count) if ("cxt_t%d_y" % t) in V %}
        {% set _ = ys.append(V["cxt_t%d_y" % t]|float) %}
    {% endfor %}
    {% set corridor = (ys|max) + clear %}
    {% for a in ("x", "y", "z") %}
        {% if (gm.position[a] - gm.gcode_position[a])|abs > 0.01 %}
            { action_raise_error("CXT: a G92/coordinate offset is active on %s - clear it first" % a|upper) }
        {% endif %}
    {% endfor %}
    {% if corridor > amax.y - 0.5 %}
        { action_raise_error("CXT: corridor Y%.2f is beyond Y travel - reduce cxt_clearance_y" % corridor) }
    {% elif pos.y < corridor - 0.5 %}
        { action_raise_error("CXT: carriage is in the dock zone (Y%.2f < corridor Y%.2f). Move it out first." % (pos.y, corridor)) }
    {% endif %}
    {% for t in params.TOOLS.split(",")|map("int") if t >= 0 %}
        {% set x0 = V["cxt_t%d_x" % t]|float %}
        {% set y0 = V["cxt_t%d_y" % t]|float %}
        {% for mode in ("pickup", "release") %}
            {% set path = V.get("cxt_%s_path" % mode, [[0, dodge, 1], [shift, dodge, 1], [shift, 0, 1], [0, 0, 2]] if mode == "pickup" else [[0, 0, 1], [shift, 0, 2], [shift, dodge, 1], [0, dodge, 1]]) %}
            {% for p in path %}
                {% set px = x0 + p[0]|float %}
                {% set py = y0 + p[1]|float %}
                {% if px < amin.x + 0.5 or px > amax.x - 0.5 or py < amin.y + 0.5 or py > corridor or p[2]|int not in (0, 1, 2) %}
                    { action_raise_error("CXT: T%d %s waypoint X%.2f Y%.2f is invalid or outside travel. Nothing moved." % (t, mode, px, py)) }
                {% endif %}
            {% endfor %}
        {% endfor %}
    {% endfor %}
    {% if not printing and pos.z < min_z %}
        {% if min_z > amax.z %}
            { action_raise_error("CXT: cxt_min_z is above Z travel") }
        {% endif %}
        G1 Z{min_z} F{V.get("cxt_feed_z", D.feed_z)}
    {% endif %}

# One dock visit. Path points are [dx, dy, speed] relative to the dock datum;
# speed 0 = travel, 1 = approach, 2 = latch.
[gcode_macro _CXT_DOCK_MOVE]
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set t = params.TOOL|int %}
    {% set mode = params.MODE %}
    {% set count = V.get("cxt_tool_count", D.tool_count)|int %}
    {% set shift = V.get("cxt_shift_x", D.shift_x)|float %}
    {% set dodge = V.get("cxt_dodge_y", D.dodge_y)|float %}
    {% set clear = V.get("cxt_clearance_y", D.clearance_y)|float %}
    {% set margin = V.get("cxt_margin_y", D.margin_y)|float %}
    {% set feeds = [V.get("cxt_feed_travel", D.feed_travel), V.get("cxt_feed_approach", D.feed_approach), V.get("cxt_feed_latch", D.feed_latch)] %}
    {% set ys = [] %}
    {% for n in range(count) if ("cxt_t%d_y" % n) in V %}
        {% set _ = ys.append(V["cxt_t%d_y" % n]|float) %}
    {% endfor %}
    {% set corridor = (ys|max) + clear %}
    {% set x0 = V["cxt_t%d_x" % t]|float %}
    {% set y0 = V["cxt_t%d_y" % t]|float %}
    {% set near = y0 + dodge + margin %}
    {% set path = V.get("cxt_%s_path" % mode, [[0, dodge, 1], [shift, dodge, 1], [shift, 0, 1], [0, 0, 2]] if mode == "pickup" else [[0, 0, 1], [shift, 0, 2], [shift, dodge, 1], [0, dodge, 1]]) %}
    G1 X{x0} Y{corridor} F{feeds[0]}
    {% if near < corridor %}
        G1 X{x0} Y{near} F{feeds[0]}
    {% endif %}
    {% for p in path %}
        G1 X{x0 + p[0]|float} Y{y0 + p[1]|float} F{feeds[p[2]|int]}
    {% endfor %}
    {% if near < corridor %}
        G1 X{x0} Y{near} F{feeds[1]}
    {% endif %}
    G1 X{x0} Y{corridor} F{feeds[0]}

#--------------------------------------------------------------------
# Operator commands
#--------------------------------------------------------------------
[gcode_macro CXT_DECLARE]
description: Tell Klipper what is physically on the carriage (TOOL=-1 for empty). Sensor must agree.
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set t = params.TOOL|default(-99)|int %}
    {% set count = V.get("cxt_tool_count", D.tool_count)|int %}
    {% if t < -1 or t >= count %}
        { action_raise_error("CXT_DECLARE: TOOL must be -1 (empty) or 0..%d" % (count - 1)) }
    {% endif %}
    _CXT_CONFIRM EXPECT={"present" if t >= 0 else "empty"} WHY=declare
    _CXT_COMMIT TOOL={t}
    _CXT_APPLY_OFFSETS
    RESPOND MSG="CXT: carriage declared {'T%d' % t if t >= 0 else 'EMPTY'} (sensor agrees)"

[gcode_macro T0]
gcode: CXT_SELECT TOOL=0
[gcode_macro T1]
gcode: CXT_SELECT TOOL=1
[gcode_macro T2]
gcode: CXT_SELECT TOOL=2
[gcode_macro T3]
gcode: CXT_SELECT TOOL=3
[gcode_macro T4]
gcode: CXT_SELECT TOOL=4
[gcode_macro T5]
gcode: CXT_SELECT TOOL=5
[gcode_macro T6]
gcode: CXT_SELECT TOOL=6
[gcode_macro T7]
gcode: CXT_SELECT TOOL=7
[gcode_macro T8]
gcode: CXT_SELECT TOOL=8
[gcode_macro T9]
gcode: CXT_SELECT TOOL=9
[gcode_macro T10]
gcode: CXT_SELECT TOOL=10
[gcode_macro T11]
gcode: CXT_SELECT TOOL=11
[gcode_macro UNTOOL]
description: Dock the mounted hotend
gcode: CXT_SELECT TOOL=-1

[gcode_macro CXT_DOCK_SAVE]
description: Save a dock datum. CXT_DOCK_SAVE TOOL=n saves the current position; add X= Y= to type values in.
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set t = params.TOOL|default(-1)|int %}
    {% set count = V.get("cxt_tool_count", D.tool_count)|int %}
    {% set th = printer.toolhead %}
    {% set typed = "X" in params and "Y" in params %}
    {% set x = params.X|float if typed else th.position.x %}
    {% set y = params.Y|float if typed else th.position.y %}
    {% if t < 0 or t >= count %}
        { action_raise_error("CXT_DOCK_SAVE: TOOL must be 0..%d" % (count - 1)) }
    {% elif not typed and ("x" not in th.homed_axes or "y" not in th.homed_axes) %}
        { action_raise_error("CXT_DOCK_SAVE: home X/Y first - the saved position comes from the homed carriage") }
    {% elif "print_stats" in printer and printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CXT_DOCK_SAVE: not while printing") }
    {% elif x < th.axis_minimum.x or x > th.axis_maximum.x or y < th.axis_minimum.y or y > th.axis_maximum.y %}
        { action_raise_error("CXT_DOCK_SAVE: X%.3f Y%.3f is outside travel" % (x, y)) }
    {% endif %}
    {% set old = "was X%.3f Y%.3f" % (V["cxt_t%d_x" % t], V["cxt_t%d_y" % t]) if ("cxt_t%d_x" % t) in V else "new" %}
    SAVE_VARIABLE VARIABLE=cxt_t{t}_x VALUE={"%.3f" % x}
    SAVE_VARIABLE VARIABLE=cxt_t{t}_y VALUE={"%.3f" % y}
    RESPOND MSG="CXT: T{t} dock saved X{'%.3f' % x} Y{'%.3f' % y} ({old})"

[gcode_macro CXT_NUDGE]
description: Adjust a saved dock datum. CXT_NUDGE TOOL=n AXIS=X DELTA=0.1 (max 1 mm per call)
gcode:
    {% set V = printer.save_variables.variables %}
    {% set t = params.TOOL|default(-1)|int %}
    {% set axis = params.AXIS|default("")|lower %}
    {% set delta = params.DELTA|default(0)|float %}
    {% set key = "cxt_t%d_%s" % (t, axis) %}
    {% if axis not in ("x", "y") or key not in V %}
        { action_raise_error("CXT_NUDGE: need a saved TOOL and AXIS=X or Y") }
    {% elif delta|abs > 1.0 or delta == 0 %}
        { action_raise_error("CXT_NUDGE: DELTA must be non-zero and at most 1 mm") }
    {% elif "print_stats" in printer and printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CXT_NUDGE: not while printing") }
    {% endif %}
    SAVE_VARIABLE VARIABLE={key} VALUE={"%.3f" % (V[key]|float + delta)}
    RESPOND MSG="CXT: {key} {'%.3f' % V[key]} -> {'%.3f' % (V[key]|float + delta)}"

[gcode_macro CXT_SET]
description: Change a setting with range checks. CXT_SET NAME=dodge_y VALUE=14  /  NAME=t1_oz VALUE=0.05
gcode:
    {% set name = params.NAME|default("")|lower %}
    {% set raw = params.VALUE|default("") %}
    {% set ranges = {
        "tool_count": (1, 12), "shift_x": (-10, 10), "dodge_y": (2, 40),
        "clearance_y": (10, 200), "margin_y": (0, 50),
        "feed_travel": (60, 36000), "feed_approach": (60, 12000), "feed_latch": (30, 6000),
        "feed_z": (60, 1200), "min_z": (5, 100), "samples": (1, 10), "sample_ms": (0, 500),
        "print_enabled": (0, 1)} %}
    {% set tool_ranges = {"ox": (-5, 5), "oy": (-5, 5), "oz": (-3, 3)} %}
    {% set parts = name.split("_", 1) %}
    {% if name in ranges %}
        {% set lim = ranges[name] %}
    {% elif parts|length == 2 and parts[0][:1] == "t" and parts[0][1:].isdigit() and parts[1] in tool_ranges %}
        {% set lim = tool_ranges[parts[1]] %}
    {% else %}
        { action_raise_error("CXT_SET: unknown setting '%s' (dock X/Y use CXT_DOCK_SAVE)" % name) }
    {% endif %}
    {% if raw|float(-99999) == -99999 %}
        { action_raise_error("CXT_SET: VALUE must be a number") }
    {% elif raw|float < lim[0] or raw|float > lim[1] %}
        { action_raise_error("CXT_SET: %s must be between %s and %s" % (name, lim[0], lim[1])) }
    {% elif "print_stats" in printer and printer.print_stats.state in ("printing", "paused") %}
        { action_raise_error("CXT_SET: not while printing") }
    {% endif %}
    {% set value = raw|int if name in ("tool_count", "samples", "sample_ms", "print_enabled", "feed_travel", "feed_approach", "feed_latch", "feed_z") else raw|float %}
    SAVE_VARIABLE VARIABLE=cxt_{name} VALUE={value}
    RESPOND MSG="CXT: {name} = {value}"

[gcode_macro CXT_TEST]
description: Supervised pickup/dropoff cycles. CXT_TEST TOOLS=0,1,2 CYCLES=3 (carriage must be EMPTY)
gcode:
    {% set S = printer["gcode_macro _CXT_STATE"] %}
    {% set tools = params.TOOLS|default("")|string %}
    {% set cycles = params.CYCLES|default(1)|int %}
    {% set list = tools.split(",")|map("int")|list if tools else [] %}
    {% if S.tool|int != -1 or S.fault|int != 0 %}
        { action_raise_error("CXT_TEST: carriage must be confirmed EMPTY first") }
    {% elif not list or cycles < 1 or (list|length * cycles) > 60 %}
        { action_raise_error("CXT_TEST: give TOOLS=0,1 and CYCLES so that tools x cycles <= 60") }
    {% endif %}
    {% for c in range(cycles) %}
        {% for t in list %}
            RESPOND MSG="CXT_TEST: cycle {c + 1}/{cycles} T{t}"
            CXT_SELECT TOOL={t}
            CXT_SELECT TOOL=-1
        {% endfor %}
    {% endfor %}
    RESPOND MSG="CXT_TEST: {cycles} cycle(s) of T{tools} passed - every pickup and dropoff sensor-confirmed"

[gcode_macro CXT_STATUS]
description: Show engine version, carriage state and every saved dock
gcode:
    {% set D = printer["gcode_macro _CXT_DEFAULTS"] %}
    {% set V = printer.save_variables.variables %}
    {% set S = printer["gcode_macro _CXT_STATE"] %}
    {% set s = printer[V.get("cxt_sensor", D.sensor)] %}
    {% set present = (s.state == "PRESSED") if "state" in s else s.filament_detected %}
    {% set count = V.get("cxt_tool_count", D.tool_count)|int %}
    {% set ys = [] %}
    {% for t in range(count) if ("cxt_t%d_y" % t) in V %}
        {% set _ = ys.append(V["cxt_t%d_y" % t]|float) %}
    {% endfor %}
    {% set out = ["CXT engine %s | tool %d | fault %d | sensor %s" % (printer["gcode_macro _CXT_ENGINE"].version, S.tool|int, S.fault|int, "PRESENT" if present else "EMPTY")] %}
    {% if ys %}
        {% set _ = out.append("corridor Y%.3f" % ((ys|max) + V.get("cxt_clearance_y", D.clearance_y)|float)) %}
    {% endif %}
    {% for t in range(count) %}
        {% if ("cxt_t%d_x" % t) in V %}
            {% set _ = out.append("T%d dock X%.3f Y%.3f | offset X%.3f Y%.3f Z%.3f" % (t, V["cxt_t%d_x" % t], V["cxt_t%d_y" % t], V.get("cxt_t%d_ox" % t, 0), V.get("cxt_t%d_oy" % t, 0), V.get("cxt_t%d_oz" % t, 0))) %}
        {% else %}
            {% set _ = out.append("T%d dock NOT SAVED" % t) %}
        {% endif %}
    {% endfor %}
    { action_respond_info(out|join("\n")) }
