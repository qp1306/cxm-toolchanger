name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jinja2 pytest
      - run: python -m pytest -q tests
      - run: bash -n install.sh
      - name: engine version matches VERSION
        run: |
          v="$(cat VERSION)"
          grep -q "variable_version: \"$v\"" klipper/cxt.cfg \
            || { echo "klipper/cxt.cfg version does not match VERSION ($v)"; exit 1; }
